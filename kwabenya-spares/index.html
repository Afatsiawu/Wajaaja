<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the page render at the device's actual width on phones,
         instead of a zoomed-out desktop-width view. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kwabenya Spares — Motorcycle Parts &amp; Fitters, Accra</title>
    <!-- Shown by search engines / link previews (e.g. sharing the site link in a chat app). -->
    <meta name="description" content="Find motorcycle spare parts across Kwabenya's shops, see each shop's assigned fitter, and get directions — all in one place." />
  </head>
  <body>
    <!-- The single empty element the whole React app mounts into — see
         ReactDOM.createRoot(document.getElementById('root')) in main.jsx. -->
    <div id="root"></div>
    <!-- type="module" lets the browser understand the `import` statements
         inside main.jsx directly. During `npm run dev` Vite serves this
         file (and everything it imports) on the fly; during `npm run
         build` this whole chain gets bundled into optimized files instead. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
